schema_version = 1

[runtime]
active_discovery = false
max_workers = 4
max_events = 10000
max_depth = 32

[scope]
allowed_hosts = ["example.test"]
excluded_hosts = []
allowed_ports = [443]
allowed_protocols = ["tcp"]
max_scope_distance = 0

[modules]
chef_org_stub_hints = false
chef_dns_mutation_hints = false
chef_git_archive_hints = false
chef_robots_archive_hints = false
chef_web_parameter_hints = false
chef_archived_web_marker_hints = false
chef_security_contact_url_hints = false

[sources.shodan]
enabled = false

[sources.censys]
enabled = false

[defectdojo]
enabled = false
