[package]
name = "chef-application"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"

[dependencies]
chef-core = { path = "../rust-core" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
