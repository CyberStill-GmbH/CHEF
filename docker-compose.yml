# Entorno local de prueba. La API todavía persiste en memoria: el servicio `db`
# queda preparado para cuando se componga el adaptador Prisma y se apliquen las
# migraciones. No se ejecutó en el entorno de entrega (sin Docker daemon).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chef
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chef-dev-only}
      POSTGRES_DB: chef
    ports:
      - '5432:5432'
    volumes:
      - chef-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chef -d chef']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      CHEF_SESSION_SECRET: ${CHEF_SESSION_SECRET:?define CHEF_SESSION_SECRET en .env}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?define GITHUB_CLIENT_ID en .env}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?define GITHUB_CLIENT_SECRET en .env}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://127.0.0.1:8787/auth/github/callback}
      PORT: '8787'
      # Escucha en todas las interfaces del contenedor; el puerto publicado se
      # acota a 127.0.0.1 del host para no exponerlo en la red.
      HOST: 0.0.0.0
      CHEF_SCOPE: fixtures/scope/lab.json
      DATABASE_URL: postgresql://chef:${POSTGRES_PASSWORD:-chef-dev-only}@db:5432/chef?schema=public
    ports:
      - '127.0.0.1:8787:8787'
    depends_on:
      db:
        condition: service_healthy

volumes:
  chef-pg:
