[package]
name = "chef-desktop"
version = "0.1.0"
description = "Aplicación de escritorio CHEF"
authors = ["CHEF contributors"]
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "chef_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chef-core = { path = "../../../packages/rust-core" }
chef-storage = { path = "../../../packages/rust-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt", "sync"] }
