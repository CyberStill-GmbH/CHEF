name: Quality
on:
  push:
    branches: [main, docs]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: npm run benchmark
  burp:
    name: Burp spike
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -f extensions/burp/pom.xml clean verify
      - name: Reproducible JAR
        run: |
          sha256sum extensions/burp/target/chef-montoya-spike-0.1.0.jar > /tmp/chef-jar.sha256
          mvn -B -f extensions/burp/pom.xml clean package -DskipTests
          sha256sum -c /tmp/chef-jar.sha256
