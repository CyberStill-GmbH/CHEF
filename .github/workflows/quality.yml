name: Quality
on:
  push:
    branches: [main, docs]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy
      - name: Cache Rust build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            packages/rust-core/target
            packages/rust-application/target
            packages/rust-storage/target
          key: ${{ runner.os }}-rust-check-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-rust-check-${{ hashFiles('**/Cargo.lock') }}-
      - name: Install native dependencies for embedded SurrealDB/RocksDB
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y nasm libclang-dev cmake
      - run: npm ci
      - run: npm run check
      - name: Check Rust application layer
        run: |
          cargo fmt --manifest-path packages/rust-application/Cargo.toml -- --check
          cargo clippy --manifest-path packages/rust-application/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path packages/rust-application/Cargo.toml --locked
      - run: npm audit --audit-level=high
      - run: npm run benchmark
  desktop:
    name: Tauri desktop compile
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy
      - name: Cache desktop Rust build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-tauri-check-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-tauri-check-${{ hashFiles('**/Cargo.lock') }}-
      - name: Install Tauri, SurrealDB, and RocksDB native dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential nasm libclang-dev cmake libwebkit2gtk-4.1-dev curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run web:build
      - name: Check Tauri commands and desktop composition
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
  burp:
    name: Burp spike
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -f extensions/burp/pom.xml clean verify
      - name: Reproducible JAR
        run: |
          sha256sum extensions/burp/target/chef-montoya-spike-0.1.0.jar > /tmp/chef-jar.sha256
          mvn -B -f extensions/burp/pom.xml clean package -DskipTests
          sha256sum -c /tmp/chef-jar.sha256
